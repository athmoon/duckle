<svg xmlns="http://www.w3.org/2000/svg" width="660" height="438" viewBox="0 0 660 438" role="img" aria-label="same source, Salesforce sink">
<style>
.m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:13.5px;white-space:pre}
.p{fill:#f5d90a;font-weight:700}
.c{fill:#c9d5e1;font-weight:600}
.out{fill:#c9d5e1}
.dim{fill:#7d8ea1}
.ok{fill:#5bc8f5}
.err{fill:#f2555a}
.key{fill:#f5d90a}
.cur{animation:blink 1.06s steps(1,end) infinite}
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
</style>
<rect width="660" height="438" rx="9" fill="#0f1720"/>
<rect width="660" height="30" rx="9" fill="#18222e"/>
<rect y="21" width="660" height="9" fill="#18222e"/>
<circle cx="19" cy="15" r="5" fill="#f2555a"/>
<circle cx="37" cy="15" r="5" fill="#f59f0a"/>
<circle cx="55" cy="15" r="5" fill="#5bc8f5"/>
<text x="246" y="19.5" class="m dim" font-size="11.5">same source, Salesforce sink</text>
<text x="18" y="65" class="m dim">#&#160;same&#160;pipeline,&#160;one&#160;line&#160;changed:&#160;where&#160;it&#160;lands</text>
<text x="18" y="107" class="m out">(duckle.src.mysql(host="127.0.0.1",&#160;database="ducktest",</text>
<text x="18" y="128" class="m out">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;tableName="orders")</text>
<text x="18" y="149" class="m out">&#160;&#160;&#160;&#160;.where(col.status&#160;==&#160;"shipped")</text>
<text x="18" y="170" class="m out">&#160;&#160;&#160;&#160;.derive(Name="f'{region}-{customer}'",&#160;Amount__c="amount")</text>
<text x="18" y="191" class="m key">&#160;&#160;&#160;&#160;.snk.salesforce(object="Order__c",&#160;operation="upsert",</text>
<text x="18" y="212" class="m key">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;externalIdField="Ext_Id__c",</text>
<text x="18" y="233" class="m key">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;accessToken="${ENV:SF_TOKEN}"))</text>
<text x="18" y="275" class="m"><tspan class="p">$</tspan> <tspan class="c">duckle validate pipelines/to_salesforce.json</tspan></text>
<text x="18" y="296" class="m ok">ok&#160;&#160;&#160;&#160;pipelines/to_salesforce.json&#160;&#160;(4&#160;stages)</text>
<text x="18" y="338" class="m out">1&#160;pipeline(s)&#160;checked,&#160;0&#160;failed</text>
<text x="18" y="380" class="m dim">#&#160;Compiled&#160;without&#160;opening&#160;MySQL&#160;or&#160;contacting&#160;Salesforce.</text>
<text x="18" y="401" class="m dim">#&#160;No&#160;credentials&#160;needed&#160;to&#160;prove&#160;the&#160;pipeline&#160;is&#160;sound.</text>
<rect class="cur" x="18" y="411" width="8" height="15" fill="#f5d90a"/>
</svg>
