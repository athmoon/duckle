<svg xmlns="http://www.w3.org/2000/svg" width="660" height="753" viewBox="0 0 660 753" role="img" aria-label="MySQL in Docker to DuckDB">
<style>
.m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:13.5px;white-space:pre}
.p{fill:#f5d90a;font-weight:700}
.c{fill:#c9d5e1;font-weight:600}
.out{fill:#c9d5e1}
.dim{fill:#7d8ea1}
.ok{fill:#5bc8f5}
.err{fill:#f2555a}
.key{fill:#f5d90a}
.cur{animation:blink 1.06s steps(1,end) infinite}
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
</style>
<rect width="660" height="753" rx="9" fill="#0f1720"/>
<rect width="660" height="30" rx="9" fill="#18222e"/>
<rect y="21" width="660" height="9" fill="#18222e"/>
<circle cx="19" cy="15" r="5" fill="#f2555a"/>
<circle cx="37" cy="15" r="5" fill="#f59f0a"/>
<circle cx="55" cy="15" r="5" fill="#5bc8f5"/>
<text x="255" y="19.5" class="m dim" font-size="11.5">MySQL in Docker to DuckDB</text>
<text x="18" y="65" class="m"><tspan class="p">$</tspan> <tspan class="c">docker ps</tspan></text>
<text x="18" y="86" class="m dim">duckle-demo-mysql&#160;&#160;&#160;mysql:8.0&#160;&#160;&#160;Up&#160;&#160;&#160;0.0.0.0:3306-&gt;3306/tcp</text>
<text x="18" y="128" class="m"><tspan class="p">$</tspan> <tspan class="c">mysql -e 'SELECT count(*) FROM orders_1m'</tspan></text>
<text x="18" y="149" class="m key">1000000</text>
<text x="18" y="191" class="m"><tspan class="p">$</tspan> <tspan class="c">cat pipeline.py</tspan></text>
<text x="18" y="212" class="m key">import&#160;duckle</text>
<text x="18" y="233" class="m key">from&#160;duckle&#160;import&#160;col</text>
<text x="18" y="275" class="m out">(duckle.src.mysql(host="127.0.0.1",&#160;database="ducktest",</text>
<text x="18" y="296" class="m out">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;password="${ENV:MYSQL_PASSWORD}",</text>
<text x="18" y="317" class="m out">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;tableName="orders_1m")</text>
<text x="18" y="338" class="m out">&#160;&#160;&#160;&#160;.where(col.status&#160;==&#160;"shipped")</text>
<text x="18" y="359" class="m out">&#160;&#160;&#160;&#160;.derive(net="round(amount&#160;*&#160;0.8,&#160;2)",</text>
<text x="18" y="380" class="m out">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;label="f'{region}-{customer}'")</text>
<text x="18" y="401" class="m out">&#160;&#160;&#160;&#160;.snk.duckdb(database="warehouse.duckdb",</text>
<text x="18" y="422" class="m out">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;tableName="shipped_orders")</text>
<text x="18" y="443" class="m out">&#160;&#160;&#160;&#160;.run())</text>
<text x="18" y="485" class="m"><tspan class="p">$</tspan> <tspan class="c">python pipeline.py</tspan></text>
<text x="18" y="506" class="m out">status&#160;&#160;&#160;:&#160;ok</text>
<text x="18" y="527" class="m key">duration&#160;:&#160;1932&#160;ms</text>
<text x="18" y="548" class="m ok">&#160;&#160;mysql&#160;&#160;&#160;&#160;&#160;&#160;ok</text>
<text x="18" y="569" class="m ok">&#160;&#160;filter&#160;&#160;&#160;&#160;&#160;ok&#160;(333333&#160;rows)</text>
<text x="18" y="590" class="m ok">&#160;&#160;pyexpr&#160;&#160;&#160;&#160;&#160;ok&#160;(333333&#160;rows)</text>
<text x="18" y="611" class="m ok">&#160;&#160;duckdb&#160;&#160;&#160;&#160;&#160;ok&#160;(333333&#160;rows)</text>
<text x="18" y="653" class="m dim">#&#160;1,000,000&#160;rows&#160;scanned,&#160;333,333&#160;landed,&#160;in&#160;under&#160;two&#160;seconds.</text>
<text x="18" y="674" class="m dim">#&#160;~518k&#160;source&#160;rows/sec,&#160;MySQL&#160;wire&#160;to&#160;DuckDB&#160;table.</text>
<text x="18" y="695" class="m dim">#&#160;No&#160;row&#160;touched&#160;Python:&#160;the&#160;filter&#160;and&#160;both&#160;derived&#160;columns</text>
<text x="18" y="716" class="m dim">#&#160;were&#160;compiled&#160;to&#160;SQL&#160;and&#160;run&#160;inside&#160;DuckDB.</text>
<rect class="cur" x="18" y="726" width="8" height="15" fill="#f5d90a"/>
</svg>
